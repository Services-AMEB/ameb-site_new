name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      captures:
        description: "Régénérer les captures de référence (tests/visual.spec.ts) dans l'environnement de la CI et les pousser sur la branche"
        type: boolean
        default: false

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  # Lancé à la main (Actions → CI → Run workflow, case « captures ») après un changement visuel voulu :
  # produit les captures dans le même environnement que le job « qualite » et les pousse sur la branche.
  # La poussée du robot ne relance pas la CI : relancer « Run workflow » sans la case ensuite.
  captures:
    name: Captures de référence
    if: github.event_name == 'workflow_dispatch' && inputs.captures
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build

      - name: Régénérer les captures
        run: npx playwright test tests/visual.spec.ts --update-snapshots

      - name: Pousser les captures
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/visual.spec.ts-snapshots
          if git diff --cached --quiet; then
            echo "Aucun changement de capture."
          else
            git commit -m "Captures de référence régénérées par la CI"
            git push
          fi

  qualite:
    name: Qualité, build et tests
    if: github.event_name != 'workflow_dispatch' || !inputs.captures
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Installation
        run: npm ci

      - name: astro check
        run: npx astro check

      - name: ESLint + Stylelint
        run: npm run lint

      - name: Contenu interdit
        run: node scripts/check-content.ts

      - name: Parité FR/EN
        run: node scripts/check-parity.ts

      - name: Registre des éléments à confirmer à jour
        run: node scripts/a-confirmer.ts --check

      - name: Build
        run: npm run build

      - name: html-validate
        run: npx html-validate "dist/**/*.html"

      - name: Liens internes, budgets, parité H2, typographie
        run: node scripts/check-dist.ts --report

      - name: Tests unitaires
        run: npm run test:unit

      - name: Navigateur Playwright
        run: npx playwright install --with-deps chromium

      - name: Playwright (a11y, privacy, forms, i18n, reduced-motion, visual)
        run: npx playwright test

      - name: Pa11y CI
        run: |
          node scripts/serve.ts 4324 &
          npx --yes wait-on@8.0.4 http://localhost:4324/
          npx --yes pa11y-ci@5.0.0 --config .pa11yci.json --sitemap http://localhost:4324/sitemap-0.xml --sitemap-find https://ameb.ca --sitemap-replace http://localhost:4324

      - name: Lighthouse CI
        run: npx --yes @lhci/cli@0.15.1 autorun

      - name: Rapports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rapports
          path: |
            playwright-report/
            test-results/
            .lighthouseci/
          retention-days: 14
          if-no-files-found: ignore
