name: Captures de référence

# Régénère les captures de tests/visual.spec.ts dans l'environnement de la CI (même image, même
# Chromium que le workflow CI) et les pousse sur la branche. À lancer manuellement sur une branche
# après un changement visuel voulu; la CI compare ensuite contre ces captures.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  captures:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build

      - name: Régénérer les captures
        run: npx playwright test tests/visual.spec.ts --update-snapshots
        env:
          CI: 'true'

      - name: Pousser les captures
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/visual.spec.ts-snapshots
          if git diff --cached --quiet; then
            echo "Aucun changement de capture."
          else
            git commit -m "Captures de référence régénérées par la CI"
            git push
          fi
